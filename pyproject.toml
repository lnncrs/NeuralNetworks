[project]
name = "neural-networks"
version = "0.1.0"
description = "Notebooks didáticos de redes neurais com PyTorch e Transformers"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "faker>=37.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "kagglehub>=0.3",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "pillow>=11.0",
    "pyarrow>=19.0",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "tqdm>=4.67",
    "transformers>=4.56,<5",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.12,<2.14",
    "torchvision>=0.27,<0.29",
]
cu132 = [
    "torch>=2.12,<2.14",
    "torchvision>=0.27,<0.29",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu132" },
    ],
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
